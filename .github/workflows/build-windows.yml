name: Build Muelle for Windows

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Extraire le code source Muelle
        shell: pwsh
        run: |
          $archive = Get-ChildItem -File -Filter '*.zip' | Select-Object -First 1
          if (-not $archive) { throw 'Aucun fichier ZIP trouvé à la racine du dépôt.' }
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath source -Force
          $cargo = Get-ChildItem -Path source -Filter Cargo.toml -Recurse | Where-Object { $_.FullName -match '[\\/]Muelle-main[\\/]Cargo.toml$' } | Select-Object -First 1
          if (-not $cargo) { throw 'Cargo.toml du projet Muelle introuvable dans le ZIP.' }
          "MUELLE_DIR=$($cargo.Directory.FullName)" >> $env:GITHUB_ENV

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Installer pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Installer Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Mettre en cache les dépendances Rust
        uses: Swatinem/rust-cache@v2

      - name: Installer les dépendances de l'interface
        shell: pwsh
        working-directory: ${{ env.MUELLE_DIR }}\apps\settings
        run: pnpm install --frozen-lockfile

      - name: Construire l'installateur Windows
        shell: pwsh
        working-directory: ${{ env.MUELLE_DIR }}
        run: ./scripts/build-installer.ps1

      - name: Publier le fichier EXE
        uses: actions/upload-artifact@v4
        with:
          name: Muelle-Installateur-Windows
          path: ${{ env.MUELLE_DIR }}/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
